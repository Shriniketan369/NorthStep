<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2">
<title>NorthStep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='16 16 210 196'%3E%3Cpath d='M28 192 C 60 194, 80 162, 100 144 C 122 124, 146 136, 170 130' fill='none' stroke='%234a5ae8' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M172 22 C 176 52, 188 64, 218 68 C 188 72, 176 84, 172 114 C 168 84, 156 72, 126 68 C 156 64, 168 52, 172 22 Z' fill='%234a5ae8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--surface:#ffffff;--text:#1d1d1f;--accent:#4a5ae8;--sidebar:#efede8;--radius:16px;--on-accent:#fff;--err:#b3263f;
--ease:cubic-bezier(.22,1,.36,1);
--muted:color-mix(in srgb,var(--text) 70%,var(--bg));--line:color-mix(in srgb,var(--text) 10%,var(--bg));--ctl:color-mix(in srgb,var(--text) 52%,var(--bg));
--ink-accent:color-mix(in srgb,var(--accent) 62%,var(--text));
--soft:color-mix(in srgb,var(--accent) 12%,var(--surface));--serif:'Fraunces',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:0.9375rem;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .5s var(--ease),color .5s var(--ease)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
input::placeholder{color:var(--muted);opacity:1}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.2}
h1{font-size:2.125rem}h2{font-size:1.375rem}h3{font-size:1.0625rem}
small,.muted{color:var(--muted)}
.nomo *,.nomo *::before,.nomo *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Focus ---------- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2[tabindex="-1"]:focus{outline:none}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg);z-index:50;transition:opacity .6s var(--ease),transform .6s var(--ease),visibility .6s;overflow-y:auto}
#login.gone{opacity:0;transform:scale(1.03);visibility:hidden;pointer-events:none}
.l-art{position:relative;overflow:hidden;background:var(--sidebar);display:flex;align-items:flex-end;padding:56px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;background:var(--accent)}
.b1{width:420px;height:420px;top:-100px;left:-80px;animation:float 14s ease-in-out infinite}
.b2{width:320px;height:320px;bottom:-80px;right:-40px;opacity:.35;animation:float 18s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
.l-brand{position:relative;max-width:380px}
.l-brand .logo{font-size:3.25rem}
.l-brand p{margin-top:12px;color:var(--muted);font-size:1.0625rem}
.l-form-wrap{display:grid;place-items:center;padding:32px}
.l-form{width:100%;max-width:360px;animation:rise .8s var(--ease) both}
.l-form h2{font-size:1.75rem;margin-bottom:6px}
.field{margin-top:16px}
.field label{display:block;font-size:0.7812rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ctl);background:var(--surface);outline:0;transition:border-color .25s,box-shadow .25s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.err{color:var(--err);font-size:0.8125rem;min-height:20px;margin-top:10px}
.tabs{display:flex;gap:4px;background:var(--sidebar);padding:4px;border-radius:12px;margin:18px 0 4px;position:relative}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:0.8438rem;font-weight:500;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.tabs button.on{color:var(--text)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:9px;transition:transform .45s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs.r .pill{transform:translateX(100%)}
.logo{font-family:var(--serif);font-weight:500;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--accent)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:500;transition:transform .25s var(--ease),box-shadow .25s,opacity .25s,filter .25s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--accent);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--ctl);box-shadow:none}
.btn.ghost:hover{background:var(--soft);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{width:100%;margin-top:20px}
.link{color:var(--ink-accent);font-weight:500;font-size:0.8438rem}
.link:hover{text-decoration:underline}
.spin{width:16px;height:16px;border:2px solid color-mix(in srgb,var(--on-accent) 40%,transparent);border-top-color:var(--on-accent);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- App shell ---------- */
#app{display:none;height:100%;grid-template-columns:244px 1fr;opacity:0}
#app.on{display:grid;animation:appin .8s .15s var(--ease) forwards}
@keyframes appin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
aside{background:var(--sidebar);padding:26px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);transition:background .5s}
aside .brand{font-size:1.625rem;padding:0 12px 22px}
.nav{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;width:100%;text-align:left;transition:color .3s,background .3s,transform .3s var(--ease)}
.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{color:var(--text);transform:translateX(2px)}
.nav.on{color:var(--text);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nav.on svg{color:var(--accent)}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;flex:none}
.me b{display:block;font-size:0.8438rem;line-height:1.2}.me small{font-size:0.75rem}
main{overflow-y:auto;padding:44px 52px 80px;transition:opacity .2s,transform .2s var(--ease)}
main.out{opacity:0;transform:translateY(8px)}
.wrap{max-width:1040px;margin:0 auto}
.rise{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.head{margin-bottom:28px}.head p{color:var(--muted);margin-top:6px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.5fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .5s,border-color .3s}
.card.lift{cursor:pointer}
.card.lift:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px color-mix(in srgb,var(--text) 40%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card h3{margin-bottom:6px}
.ico{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stat b{font-family:var(--serif);font-size:2.125rem;font-weight:500;display:block;line-height:1.1}
.stat small{font-size:0.8125rem}
.sec{font-size:0.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:34px 0 14px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .grow{flex:1;min-width:0}
.row b{font-weight:500}
.rlink{display:block;width:100%;text-align:left}
.tag{display:inline-block;font-size:0.7188rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink-accent);letter-spacing:.02em}
.tag.n{background:var(--sidebar);color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width 1.2s var(--ease)}
.trend{display:flex;align-items:flex-end;gap:12px;height:120px;margin-top:10px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:0.6875rem;color:var(--muted)}
.trend i{display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--accent);height:0;transition:height 1.1s var(--ease);opacity:.9}

/* ---------- Gauge ---------- */
.gauge{position:relative;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:9}
.gt{stroke:var(--line)}
.gp{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--ease)}
.gv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
.gv b{font-size:2.5rem;font-weight:500}.gv small{font-size:1rem;margin:8px 0 0 2px}

/* ---------- Questionnaire ---------- */
.stage{max-width:660px;margin:0 auto}
.prog{display:flex;justify-content:space-between;font-size:0.7812rem;color:var(--muted);margin-bottom:10px}
.qcard{margin-top:26px;animation:inR .55s var(--ease) both}
.qcard.back{animation-name:inL}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.qcard h2{font-size:1.75rem;margin-bottom:8px}
.qcard>p{color:var(--muted);margin-bottom:22px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{text-align:left;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500;transition:all .3s var(--ease);display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateX(4px)}
.opt.sel{border-color:var(--accent);background:var(--soft);transform:translateX(4px)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ctl);flex:none;transition:all .3s var(--ease);display:grid;place-items:center}
.opt.sel .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:0.875rem;transition:all .3s var(--ease)}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
.big{font-family:var(--serif);font-size:3.5rem;text-align:center;margin:26px 0 8px}
input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.note{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--soft);display:flex;gap:14px;align-items:center;justify-content:space-between;animation:rise .5s var(--ease) both}
.load{text-align:center;padding:90px 0;animation:rise .6s var(--ease) both}
.orb{width:74px;height:74px;border-radius:50%;margin:0 auto 28px;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 40%,#fff),var(--accent));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18);box-shadow:0 0 0 22px color-mix(in srgb,var(--accent) 12%,transparent)}}
.msg{height:24px;color:var(--muted);transition:opacity .35s}

/* ---------- Report ---------- */
.hero{display:flex;align-items:center;gap:34px;flex-wrap:wrap}
.hero .grow{flex:1;min-width:240px}
.hero h1{margin:8px 0 10px}
.frow{display:grid;grid-template-columns:150px 1fr 90px;gap:14px;align-items:center;padding:9px 0;font-size:0.875rem}
.frow.nf{grid-template-columns:170px 1fr 50px}
.frow small{text-align:right}
.math{font-family:ui-monospace,Menlo,monospace;font-size:0.7812rem;background:var(--bg);padding:14px;border-radius:12px;line-height:1.8;overflow-x:auto;margin-top:12px}
.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden;transition:border-color .3s}
.acc.open{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.acc>button{width:100%;display:flex;align-items:center;gap:14px;padding:18px 22px;text-align:left}
.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--ink-accent);display:grid;place-items:center;font-weight:600;font-size:0.8125rem;flex:none;transition:all .4s var(--ease)}
.acc.done .num{background:var(--accent);color:var(--on-accent)}
.acc>button .grow{flex:1}
.chev{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .45s var(--ease)}
.acc.open .chev{transform:rotate(180deg)}
.acc .in{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.acc.open .in{grid-template-rows:1fr}
.in>div{overflow:hidden;visibility:hidden;transition:visibility 0s .5s}
.acc.open .in>div{visibility:visible;transition-delay:0s}
.in .pad{padding:2px 22px 22px 66px}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;width:100%;text-align:left}
.sck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ctl);flex:none;margin-top:1px;display:grid;place-items:center;transition:all .3s var(--ease)}
.sck svg{width:14px;height:14px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .05s}
.step.on .sck{background:var(--accent);border-color:var(--accent)}
.step.on .sck svg{stroke-dashoffset:0}
.step span{transition:color .3s}.step.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tip{padding:14px 16px;border-radius:12px;background:var(--soft);font-size:0.875rem;margin-bottom:10px}
.tip b{display:block;font-size:0.7812rem;color:var(--ink-accent);margin-bottom:2px}
.disc{font-size:0.7812rem;color:var(--muted);margin-top:34px;text-align:center}

/* ---------- Settings ---------- */
.presets{display:flex;gap:12px;flex-wrap:wrap}
.preset{padding:10px;border-radius:14px;border:1px solid var(--line);width:104px;text-align:center;font-size:0.8125rem;font-weight:500;transition:all .3s var(--ease)}
.preset:hover{transform:translateY(-3px)}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.sw{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}.sw i{flex:1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cpick{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.cpick input{width:38px;height:38px;border:0;border-radius:10px;background:none;cursor:pointer;padding:0}
.cpick b{display:block;font-weight:500;font-size:0.875rem}.cpick small{font-family:ui-monospace,monospace;font-size:0.75rem}
.sline{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0}
.tg{width:44px;height:26px;border-radius:99px;background:var(--ctl);position:relative;transition:background .3s;flex:none}
.tg::before{content:'';position:absolute;inset:-10px -4px}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .4s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(18px)}

@media(max-width:860px){
 #login{grid-template-columns:1fr}.l-art{display:none}
 #mlogo{display:block!important;margin-bottom:18px}
 #app,#app.on{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 aside{order:2;flex-direction:row;padding:8px;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
 aside .brand,.me,.spacer{display:none}
 .nav{flex-direction:column;gap:2px;font-size:0.6875rem;padding:8px 4px;text-align:center;justify-content:center;width:auto;min-height:48px;min-width:48px}
 main{padding:26px 20px 40px}.g3,.g2,.g21{grid-template-columns:1fr}h1{font-size:1.75rem}
 .frow{grid-template-columns:110px 1fr 70px}.frow.nf{grid-template-columns:120px 1fr 44px}.in .pad{padding-left:22px}
 .btn,.opt,.chip,.tabs button,.preset,.step{min-height:44px}
 .link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
 .rlink{min-height:44px;display:flex;flex-direction:column;justify-content:center}
 .rrow{flex-wrap:wrap;row-gap:6px}
 .rrow .grow{flex:1 1 calc(100% - 64px)}
 .rrow .tag{margin-left:56px}
 .rrow .link{margin-left:auto!important}
 .cpick input{width:44px;height:44px}
 input[type=range]{height:44px}
 .row[role=button]{min-height:44px}
 .acc>button{min-height:56px}
 .card{padding:20px}
 .hero{gap:22px}
 .big{font-size:3rem}
}
@media print{aside,.noprint{display:none!important}#app{display:block!important}main{padding:0;overflow:visible}.acc .in{grid-template-rows:1fr!important}.acc .in>div{visibility:visible!important}}
.thm{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:border-color .3s,transform .3s var(--ease)}
.thm:hover{border-color:var(--accent);transform:rotate(15deg)}.thm svg{width:19px;height:19px}
#ld{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;transition:opacity .7s var(--ease),visibility .7s}#ld.out{opacity:0;visibility:hidden}
.lw{width:min(340px,80vw);text-align:center}.lw svg{margin-bottom:10px}
.lb{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:26px}.lb i{display:block;height:100%;width:0;background:var(--accent);transition:width 3s var(--ease)}
#lc{margin-top:14px;min-height:24px;transition:opacity .25s}
.agel{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:0.8125rem;color:var(--muted)}.agel input{width:20px;height:20px;accent-color:var(--accent)}
.sk{display:inline-block;padding:5px 13px;border-radius:99px;margin:4px 6px 4px 0;font-size:0.8438rem;font-weight:500;border:1px solid var(--line)}
.sk.c{background:var(--soft);color:var(--ink-accent);border-color:var(--accent)}.sk.p{border-color:var(--ctl);color:var(--text);border-style:dashed}.sk.n{color:var(--muted)}
select.input{appearance:auto}.big{font-family:var(--serif);font-size:2.875rem;line-height:1.1}
@media(max-width:860px){aside{overflow-x:auto}.nav{flex:1;min-width:40px;font-size:0.625rem;padding:8px 2px}.asd{display:none!important}}
@media(min-width:861px){body.signed #thm2{display:none}}

 ['Pick a headline you’d love to be part of.',[['Student programme lifts outcomes across a city',{education:2}],['Clinic cuts patient waiting times in half',{health:2}],['Lab finds a better way to store energy',{research:2}],['Startup’s tool reaches one million users',{tech:2,business:2}]]]];
const NMAX=Object.fromEntries(DK.map(k=>[k,NQ.reduce((s,q)=>s+Math.max(...q[1].map(o=>o[1][k]||0)),0)]));
function nicheCalc(picks,qs){
 qs=qs||NQ;
 const nmax=Object.fromEntries(DK.map(k=>[k,qs.reduce((t,q)=>t+Math.max(...q[1].map(o=>o[1][k]||0)),0)]));
 const sc=Object.fromEntries(DK.map(k=>[k,0])),hit=Object.fromEntries(DK.map(k=>[k,0]));
 picks.forEach((p,i)=>{const q=qs[i];if(!q||!q[1][p])return;const w=q[1][p][1];for(const k in w){sc[k]+=w[k];hit[k]++}});
 const tot=DK.reduce((t,k)=>t+sc[k],0)||1,sh=DK.map(k=>sc[k]/tot);
 const rank=DK.map((k,i)=>({k,s:sc[k],share:sh[i],fit:nmax[k]?Math.round(100*sc[k]/nmax[k]):0,hit:hit[k]})).sort((a,b)=>b.s-a.s);
 const H=-sh.reduce((t,x)=>t+(x>0?x*Math.log(x):0),0)/Math.log(DK.length);
 const gap=rank[0].share-rank[1].share;
 const conf=Math.round(clamp(100*(.35+1.1*gap+.35*(1-H)),0,100));
 const margin=clamp(Math.round(12-20*gap),4,12);
 return {rank,conf,gap,H,margin,total:qs.length};
}

 if(!u.guest){const a=getAccts();if(own(a,u.email)){delete a[u.email];LS.set('accounts',a)}LS.set('outbox',[].concat(LS.get('outbox',[])).filter(x=>x&&x.e!==u.email))}
 logout('Your account and data were deleted from this device. You can create a new one any time.')}
$('#out').onclick=()=>logout();
$('#demo').onclick=()=>{setMode('in');$('#age').checked=true;$('#le').value=DEMO.email;$('#lp').value=DEMO.pw;$('#lf').requestSubmit()};
$('#guest').onclick=()=>{if(!$('#age').checked)return void($('#lerr').textContent='NorthStep is for people 16 and over. Please confirm your age to continue.');enter({name:'Guest',email:'',guest:true})};
function lockFail(){const l=LS.get('lock',null)||{n:0,until:0};l.n=(+l.n||0)+1;if(l.n>=5)l.until=Date.now()+Math.min(300000,30000*Math.pow(2,l.n-5));LS.set('lock',l)}
$('#lf').onsubmit=async e=>{e.preventDefault();if(busy)return;
 const raw=$('#le').value,em=cleanEmail(raw),pw=$('#lp').value,btn=$('#lbtn'),err=$('#lerr');
 const fail=t=>{err.textContent=t;$('#lf').classList.remove('shake');void $('#lf').offsetWidth;$('#lf').classList.add('shake')};
 const lk=LS.get('lock',null);if(lk&&+lk.until>Date.now())return fail('Too many tries. Wait '+Math.ceil((lk.until-Date.now())/1000)+' seconds and try again.');
 if(!$('#age').checked)return fail('Please confirm you are 16 or older.');
 if(!em)return fail(raw.trim()?'That email address doesn’t look right.':'Please enter your email address.');
 if(!pw)return fail('Please enter your password.');
 if(!pw.trim())return fail('Your password can’t be only spaces.');
 if(pw.length>128)return fail('That password is too long (128 characters at most).');
 if(mode==='up'&&pw.length<8)return fail('Use at least 8 characters for your password.');
 busy=true;err.textContent='';btn.innerHTML='<div class="spin"></div>';btn.style.pointerEvents='none';btn.setAttribute('aria-busy','true');
 let user=null,msg='';
 try{const accts=getAccts();
  if(mode==='up'){
   if(em===DEMO.email||own(accts,em))msg='There’s already an account with this email. Try signing in instead.';
   else{const salt=rnd(),nm=cleanText($('#ln').value,40)||'Friend';accts[em]={n:nm,s:salt,h:await hashPw(pw,salt),at:Date.now()};LS.set('accounts',accts);user={name:nm,email:em}}}
  else if(em===DEMO.email&&pw===DEMO.pw)user={name:'Demo User',email:em};
  else if(own(accts,em)&&same(await hashPw(pw,accts[em].s),accts[em].h))user={name:accts[em].n,email:em};
  else{lockFail();msg='That email and password don’t match.'}
  await sleep(400)}
 catch(x){msg='Something went wrong. Please try again.'}
 busy=false;btn.removeAttribute('aria-busy');btn.style.pointerEvents='';btn.innerHTML=`<span>${mode==='up'?'Create account':'Sign in'}</span>`;
 if(!user)return fail(msg);
 LS.del('lock');$('#lp').value='';enter(user)};
/* Two tabs open: signing out or changing data in one is reflected in the other. */
window.addEventListener('storage',e=>{if(!e.key||e.key.indexOf('pb_')!==0)return;
 if(e.key==='pb_user'){let u=null;try{u=e.newValue?JSON.parse(e.newValue):null}catch(x){}const signed=document.body.classList.contains('signed');if(!u&&signed)showLogin();else if(u&&!signed)enter(u);return}
 if(e.key==='pb_theme'){const t=cleanTheme(LS.get('theme',null));if(JSON.stringify(t)!==JSON.stringify(theme)){theme=t;applyTheme()}return}
 if(document.body.classList.contains('signed')&&e.key.indexOf('pb_'+SCOPE+'_')===0&&(state.view==='home'||state.view==='reports'))go(state.view,state.param,'replace')});
/* Banner: offline or blocked storage */
window.__bn=function(){const b=document.getElementById('bn');if(!b)return;const t=[];if(navigator.onLine===false)t.push('You’re offline. NorthStep keeps working here, and anything it needs to send goes out when you’re back online.');if(LS.bad)t.push('This browser isn’t letting NorthStep save, so your progress will be lost when you close the page.');b.textContent=t.join(' ');b.hidden=!t.length};
addEventListener('online',window.__bn);addEventListener('offline',window.__bn);window.__bn();
const saved=LS.get('user',null);if(saved&&typeof saved==='object'&&!Array.isArray(saved)){enter(saved)}
</script>
</body>
</html>
